<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LogiTrack - Login</title>
</head>
<body>
    <h1>LogiTrack</h1>
    <h2>Iniciar sesión</h2>

    <form id="form-login">
        <label>Usuario:<br>
            <input type="text" id="username" placeholder="Usuario" autocomplete="username">
        </label>
        <br><br>
        <label>Contraseña:<br>
            <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
        </label>
        <br><br>
        <button type="submit" id="btn-login">Ingresar</button>
    </form>

    <div id="mensaje"></div>

    <script src="login.js"></script>
</body>
</html>
